name: Update UK news dataset

on:
  schedule:
    # GitHub Actions scheduled runs can be delayed during busy periods and are
    # not guaranteed to the minute. The site keeps the last successful dataset
    # if a run fails.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  # Needed to dispatch deploy.yml. Pushes made with the default GITHUB_TOKEN do
  # not start other workflows, so the commit cannot trigger Pages by itself.
  actions: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and normalise public RSS feeds
        run: npm run news

      - name: Commit updated dataset
        run: |
          if git diff --quiet -- public/data; then
            echo "No news changes to commit."
            exit 0
          fi
          git config user.name "RetroPortal News Bot"
          git config user.email "retroportal-news@users.noreply.github.com"
          git add public/data
          git commit -m "chore: refresh UK news dataset"
          git pull --rebase --autostash origin main
          git push

      - name: Trigger Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      # The deployment fetches the latest main branch, including any news
      # commit. This runs even when the data was unchanged so a failed dispatch
      # is retried on the next schedule.
